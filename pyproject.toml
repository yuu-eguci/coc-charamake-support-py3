[project]
name = "coc-charamake-support"
version = "0.1.0"
description = "CoC TRPG キャラメイク用ツール"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.format]
line-ending = "lf"
